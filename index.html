<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
        crossorigin="anonymous">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

    <link rel="stylesheet" href="./assets/css/style.css">

    <title>User System (LS)</title>
</head>

<body>

    <div class="container">

        <div class="row">

            <div class="col-8 offset-2">

                <div class="card shadow mt-5">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center">

                            <div class="d-flex align-items-center">

                                <div class="user-icon-box">

                                    <i class="fa-solid fa-users fa-2x"></i>

                                </div>

                                <div class="ml-3">

                                    <h3 class="mb-0">
                                        User List
                                    </h3>

                                    <p class="mb-0">
                                        Manage users and their details
                                    </p>

                                </div>

                            </div>

                            <button class="btn btn-primary" id="addBtn">

                                <i class="fa-solid fa-plus"></i>
                                Add User
                            </button>
                        </div>
                        
                         <table class="table table-bordered table-responsive">
                    <thead>
                        <tr>
                            <th>Sr.No</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userContainer">
                        <!-- <tr>
                            <td>1</td>
                            <td>charu</td>
                            <td>charu@gmail.com</td>
                            <td>admin</td>
                            <td>active</td>
                            <td>
                                <button class="btn btn-sm btn-primary">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr> -->
                    </tbody>
                </table>
                    </div>
                </div>
           </div>
        </div> 
        <div class="backdrop" id="backdrop"></div>
        <div class="col-6 offset-3">
             <form class="form" id="form">
                       <div class="card shadow">
                        <div class="card-header d-flex fa-2x justify-content-between">
                           <h3>Add User</h3>
                           <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="card-body form-group">
                             <label for="name">Name:-</label>
                             <input type="text" class="form-control" id="name">
                        
                             <label for="name">Email:-</label>
                             <input type="text" class="form-control" id="email">
                        
                             <label for="name">Role:-</label>
                              <select name="" id="role" class="form-control">
                                <option value="" selected disabled>Role</option>
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                                <option value="editor">Editor</option>
                            </select>
                             <label for="name">Status:-</label>
                              <select name="" id="status" class="form-control">
                                <option value="" selected disabled>status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <button type="submit" class="btn btn-sm btn-outline-primary" id="addUser">Add User</button>
                            <button type="button" class="btn btn-sm btn-outline-primary d-none" id="updateUser">Update User</button>
                            <button type="button" class="btn btn-sm btn-outline-danger" id="closeBtn">Close</button>
                        </div>
                       </div>
                    </form>
                 </div>   
             </div>

             <div class="spinner d-none" id="spinner">
  <div class="spinner-border" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
